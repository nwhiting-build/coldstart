<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Site Set-Out VR</title>
<style>
  body { margin: 0; overflow: hidden; background: #cfe0ee; font: 17px/1.5 Georgia, "Times New Roman", serif; color: #1e2a44; }
  canvas { display: block; }
  #ui { position: fixed; left: 0; right: 0; bottom: 24px; text-align: center; pointer-events: none; }
  #ui > * { pointer-events: auto; }
  #enter { display: none; font: inherit; font-size: 22px; padding: 12px 34px; border: 3px solid #1e2a44; background: #1e2a44; color: #f4f1e8; border-radius: 3px; cursor: pointer; }
  #enter:hover { background: #e8801a; border-color: #e8801a; }
  #note { margin: 10px auto 0; max-width: 62ch; font-size: 15px; color: #f4f1e8; background: rgba(30,42,68,0.8); padding: 6px 14px; border-radius: 3px; }
  h1 { position: fixed; top: 16px; left: 22px; margin: 0; font-weight: normal; font-size: 22px; }
</style>
</head>
<body>
<h1>Site Set-Out</h1>
<div id="ui"><button id="enter">Enter VR</button><p id="note">Loading the site.</p></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>

// =====================================================================
// SITE SET-OUT — CPCCBC4018 in VR. Stage 1: Standard set-out, ten steps.
// Content follows the MBAWA "Standard Set Out Procedures" deck.
// =====================================================================

var C = { ink: "#1e2a44", paper: "#f4f1e8", ply: "#c9a978", orange: "#e8801a", green: "#2f8f5b", red: "#c9302c", blue: "#2857c4", mute: "#6f7480", rule: "#cfc9b9", white: "#ffffff" };
var FONT = "Georgia, 'Noto Serif', 'Times New Roman', serif";

// ---------- the job ----------
// Lot 12: 20.000 wide x 30.000 deep. Street frontage on the +z side.
// Building: 12.000 wide x 9.000 deep, brick veneer on slab.
// Front setback 6.000, west side setback 4.000. Diagonal = root(144 + 81) = 15.000.
var LOT = { w: 20, d: 30, x0: -10, x1: 10, zRear: -15, zFront: 15 };
var JOB = { front: 6.0, side: 4.0, width: 12.0, depth: 9.0 };
var TRUE = {
  A: { x: LOT.x0 + JOB.side, z: LOT.zFront - JOB.front },          // front-west, the critical corner
  D: { x: LOT.x0 + JOB.side, z: LOT.zFront - JOB.front - JOB.depth }, // rear-west
  F: { x: LOT.x0 + JOB.side + JOB.width, z: LOT.zFront - JOB.front },  // front-east
  G: { x: LOT.x0 + JOB.side + JOB.width, z: LOT.zFront - JOB.front - JOB.depth } // rear-east
};
var DIAG = Math.sqrt(JOB.width * JOB.width + JOB.depth * JOB.depth);
var TOL_SNAP = 0.04;   // inside this, the peg is exactly right
var TOL_CARRY = 0.30;  // inside this, the peg goes in where you put it and the error carries
var TOL_DIAG = 0.003;  // acceptable diagonal difference, domestic work

// what the player has actually put in the ground
var pegs = {};        // A, B, C, E, D, F, G  -> {x,z}
var profiles = [];    // 8 hurdles -> {x,z,rot,slot,headErr,nail}
var checked = { calc: false, measured: false, square: false, fixed: false };
var poured = false, score = { right: 0, missed: 0 };
var estimate = "";

// ---------- the steps ----------
// mode: read | place | cross | tap | keypad | measure | quiz | pour | done
var SETOUT_STEPS = [
  { n: 0, title: wrongRun ? "Watch it go wrong" : "Set-out: the ten steps",
    mode: "intro",
    task: "You are on the verge outside Lot 12. The plan is on the clipboard. Before anything goes in the ground, here is the whole sequence you are about to walk through - the same order every job, no skipping:\n\n1  Confirm the block and the survey pegs\n2  Boundary offset lines\n3  First building corner - peg A\n4  A 90 degree corner - isometric triangle\n5  Remaining corners, largest rectangle first\n6  Profiles, 1.5 m outside the dig, all heads level\n7  Transfer lines to the profiles\n8  Diagonal check, within 3 mm, before any concrete\n9  Wall lines on the profiles\n10  Final dimension check, then pour\n\nAt each step the game will walk you to the spot and tell you what to do. Press Next to start.",
    why: "Set out is where the plan becomes the building. A 2 degree error at the start is 420 mm out of position after 12 metres." },
  { n: 1, title: "Confirm the block and find the survey pegs",
    mode: "tap", watch: "Watch: the game walks you to each survey peg and confirms it. Four white tops, four nails - that is the boundary.", targets: ["survey"],
    task: "Four survey pegs mark the boundary. A licensed surveyor put them there - that is the cadastral survey, and you cannot start without it. Check the lot number on the plan is the lot you are standing on, then confirm each peg.",
    how: "Look for the white-topped peg inside the orange ring at your feet. Point the controller at it and pull the trigger. The game will then move you to the next one.",
    why: "If you cannot find a survey peg - stop and call a surveyor. Never set out from an unconfirmed boundary. Boundary setbacks are legally enforceable and a wrong position can be a demolition order." },
  { n: 2, title: "Establish the boundary offset lines",
    mode: "tap2", watch: "Watch: the two offset lines are on the ground. The crossing is the building corner.",
    task: "Two blue lines have been run on the ground. One runs across the block 6.000 back from the front pegs - the front setback. One runs down the block 4.000 in from the west fence - the side setback. Everything is measured from these lines, not from the pegs in the grass.",
    how: "You are standing beside where the two lines cross. Point at the orange ring on the crossing and pull the trigger.",
    why: "The offset lines are the base lines for the whole set-out. The front line gives you the setback; the west line gives you the side clearance." },
  { n: 3, title: "Drive the first building corner - peg A",
    mode: "place", peg: "A", watch: "Watch: the tapes run out to both boundaries. When they read 6.000 and 4.000 the peg goes in.",
    task: "Peg A is the front-west corner of the building: 6.000 back from the front boundary and 4.000 in from the west boundary.",
    how: "Point at the ground near the ring. Two yellow tapes run out to the boundaries and the readout shows what each one says. Move the pointer until it reads 6.000 from the front and 4.000 from the west, then pull the trigger to drive the peg. Inside 40 mm counts as exact.",
    why: "This is the critical corner peg. It sets the legal offset from the boundary. It is the one peg you never move later." },
  { n: 4, title: "The 90 degree corner - what we are about to do",
    mode: "explain", watch: "Watch: nothing goes in the ground yet. Read this one.",
    task: "We have peg A on the front line. We need a line running back into the block at exactly 90 degrees to it - the west wall. There is no protractor big enough, so we use symmetry instead.\n\nPut two pegs, B and C, the same distance either side of A along the front line. Hook a tape on each and pull them back into the block until the two tapes read the same. Every point where two equal tapes meet is exactly the same distance from B as from C - and the only such points lie on a line through A at right angles to B-C. Drive a peg there, string it back to A, and you have your 90 degree line.\n\nThree pegs, two tapes, no maths. Then we prove it with 3:4:5.",
    how: "Press Next.",
    why: "The further apart B and C are, the more accurate the perpendicular. 3 m is the textbook figure; use more on a bigger building. If the side setback is too tight for a peg 3 m west of A, build the triangle at the other end of the front line, or shorten B-C - never put a peg over the boundary." },
  { n: 4, title: "Isometric triangle - peg B",
    mode: "place", peg: "B", watch: "Watch: one on the hook at A, one walking the tape 3.000 east along the front line. Read the tape, drive the peg.",
    task: "Peg B: 3.000 east of A, on the front line.",
    how: "Point at the ground east of A. The tape reads from A; the second readout tells you how far off the front line you are. Trigger at 3.000 from A, on the line.",
    why: "The tape is hooked over the nail in peg A - not the edge of the peg. Nail to nail, every time." },
  { n: 5, title: "Isometric triangle - peg C",
    mode: "place", peg: "C", watch: "Watch: same tape, same hook on A, 3.000 the other way.",
    task: "Now peg C, 3.000 west of A on the same line. Both distances must be identical - same tape, both measured from A.",
    how: "Same again on the west side. 3.000 from A, zero off the line, trigger.",
    why: "Symmetry is the whole trick. Nothing else in this method matters if B and C are not equal distances from A." },
  { n: 6, title: "Isometric triangle - two tapes cross at E",
    mode: "cross", watch: "Watch: one hooks a tape on B and a tape on C. The other walks both reels back into the block and slides across until the two tapes read the same. That is E.",
    task: "A tape is hooked on B and another on C. Pull both back into the block until they cross. The crossing is directly behind A on the perpendicular.",
    how: "Point at the ground behind A, about 6 m in. Two tapes follow the pointer, one from B and one from C. Slide sideways until both read the same number, then trigger. That is peg E.",
    why: "No protractor, no trig. Two equal tapes from two equal pegs cross on the perpendicular bisector, and A is its foot. String A to E is your 90 degree line." },
  { n: 6, title: "Prove the corner - 3:4:5",
    mode: "check345", watch: "Watch: 3.000 along the front line is peg B already. 4.000 back along A-E gets a mark. The tape from B to that mark must read 5.000.",
    task: "Never trust a corner you have not checked. 3 squared plus 4 squared is 9 plus 16, which is 25 - and 5 squared is 25. So if the two legs are 3.000 and 4.000, the diagonal is 5.000 only when the angle is exactly 90 degrees. Longer than 5.000, the angle is open. Shorter, it is closed.",
    how: "Press Do this step and read the tape.",
    why: "Scale it up when you can - 6:8:10, 9:12:15. A bigger triangle spreads the same tape error over more metres and the corner comes out truer." },
  { n: 7, title: "Remaining corners - largest rectangle first",
    mode: "place", peg: "D", watch: "Watch: 9.000 from A along the line through E.",
    task: "Measure 9.000 from A along the line A-E and drive peg D, the rear-west corner.",
    how: "Follow the orange string from A through E. The readout gives distance along the line and how far off it you are. 9.000 along, zero off, trigger.",
    why: "Every building reduces to rectangles. Set out the largest one first, always. Sub-shapes inherit its errors." },
  { n: 8, title: "Peg F - front-east corner",
    mode: "place", peg: "F", watch: "Watch: 12.000 from A along the front line.",
    task: "12.000 east of A along the front line. Drive peg F.",
    how: "Back to the front line. 12.000 from A, zero off the line, trigger.",
    why: "F is set from the front offset line, so like A it sits on a critical line." },
  { n: 9, title: "Peg G - rear-east corner",
    mode: "place", peg: "G", watch: "Watch: 12.000 from D and 9.000 from F.",
    task: "G is 12.000 from D and 9.000 from F. Two tapes again.",
    how: "Point at the ground in the rear-east corner. Slide the pointer until one tape reads 12.000 and the other 9.000, then trigger.",
    why: "You now have four corners. You do not yet know if they make a rectangle. That is what the diagonal check is for - but profiles come first." },
  { n: 10, title: "Install profiles - 1.5 m outside the excavation",
    mode: "profiles", watch: "Watch: eight hurdles go in, two at each corner, each about 2 m past the peg on the wall line.",
    task: "Corner pegs sit inside the excavation and the excavator will destroy them. Hurdle profiles store the building position outside the dig - two at each corner, one on each wall line, eight in all.",
    how: "The ring shows where the next profile goes. Point at the ground on the extension of the wall line, past the corner. The readout shows how far past the corner you are - it must be 1.5 m or more. Trigger to drive the hurdle. The game moves you to the next one.",
    why: "Minimum 1.5 m clearance for mechanical excavation, 0.5 m for manual. Profiles are your insurance: pegs get knocked, profiles don't." },
  { n: 11, title: "The golden rule - all heads level",
    mode: "level", watch: "Watch: the level reads each head in turn. One reads 100.945 against 100.900. It gets dropped.",
    task: "One of the eight heads is not at the same reduced level as the rest.",
    how: "Point at a profile board and the readout gives its head RL. Seven of them read 100.900. Find the one that does not and pull the trigger on it to drop it to datum.",
    why: "If one head is high the string runs on a slope, and every distance you measure is a slope distance. 10.000 m at 2 degrees reads 9.994 - a 6 mm error, enough to fail a diagonal check." },
  { n: 12, title: "Transfer the lines to the profiles",
    mode: "transfer", watch: "Watch: string through the nail, plumb up to the board, nail driven. Eight times.",
    task: "Run the string through each peg nail, plumb it up to the profile board and drive a nail there. After this the pegs can be knocked out without losing the building.",
    how: "Point at the profile in the ring and pull the trigger to drive its nail. Eight times. The game moves you round.",
    why: "Spirit level for short domestic spans, plumb bob for vertical transfer, oil bath reflector for long commercial spans." },
  { n: 13, title: "Calculate the diagonal before you measure it",
    mode: "keypad", watch: "Watch: 144 plus 81 is 225. Root of 225 is 15.000. Keyed in before the tape comes out.",
    task: "Building is 12.000 x 9.000. c = root(a squared + b squared).",
    how: "Key the diagonal you expect into the clipboard, in metres, and press Check. Do this before you measure anything.",
    why: "Write the target down before you go to the tape. A measured figure with nothing to compare it to tells you nothing." },
  { n: 14, title: "Diagonal check - profile to profile",
    mode: "measure", watch: "Watch: both diagonals taped from the profile nails.",
    task: "Both diagonals, profile nail to profile nail, not string to string - strings sag. Both must be equal within 3 mm, and both should match the number you just calculated.",
    how: "Press Measure on the clipboard and read the two figures.",
    why: "This is the only proof of square. Do it before any concrete is poured. Five minutes now against $40,000 in rectification." },
  { n: 15, title: "Not square - fix it the right way",
    mode: "quiz", watch: "Watch: the rear line is the one that moves - the front and west lines hold the setbacks.",
    q: "The diagonals differ. Which line do you move?",
    options: ["The front line A-F", "The west line A-D", "The rear line D-G"], answer: 2,
    task: "Identify the critical line - the one set at the correct offset from the boundary - and the critical corner peg. Never move those. Move the non-critical line by the full difference, both pegs, same direction, then measure again.",
    how: "Pick the line on the clipboard.",
    why: "Moving the critical peg shifts the whole building off its legal setback. The rear line is the one that is free to move." },
  { n: 15, title: "Drop the corners - plumb bob and clout nail",
    mode: "corners", watch: "Watch: at each corner the two strings cross in the air. The plumb bob hangs from the crossing, settles, and a clout nail goes into the peg under its point.",
    task: "The building position now lives on the profiles. To put a corner back on the ground - for the concretor, or after the pegs have been knocked - run both strings, hang the plumb bob from where they cross, let it stop dead, and drive a clout nail into the peg where the point touches. That nail is the corner.",
    how: "Press Do this step.",
    why: "Wait for the bob to stop completely. A bob still swinging by 5 mm marks a corner 5 mm out. Shield it from the wind with your body." },
  { n: 16, title: "Mark the wall lines and pour",
    mode: "pour", watch: "Watch from the street: excavation, slab, then the frame.",
    task: "Brick veneer on slab: three nails per profile - outside face of brickwork and slab edge, outside face of frame, and the rebate formwork. Final dimension check against the plan, then the excavator comes in and the slab goes down.",
    how: "Press Pour on the clipboard and watch from the street.",
    why: "Different construction types need different nails. Cavity brick on slab needs four, strip footing cavity brick five or more. Wrong nail, wrong position for that trade." },
  { n: 17, title: "The frame goes on",
    mode: "done",
    task: "", why: "" }
];
var guided = true, demoRunning = false, wrongRun = /wrong/.test(location.hash), voiceOn = true, stepIdx = 0, stepDone = true, quizPicked = -1, levelPicked = false, feedback = "";
var tab = "setout";
var showPlan = false, showSteps = false, showSheet = false, ffMode = false;
var tours = {}, tourSheets = {};

var STEPS = SETOUT_STEPS; SETOUT_STEPS.forEach(function (st, i) { st.n = i; });
function step() { return STEPS[stepIdx]; }
function fmt(m) { return (Math.round(m * 1000) / 1000).toFixed(3); }
function mm(m) { return Math.round(m * 1000) + " mm"; }
function dist(a, b) { return Math.hypot(a.x - b.x, a.z - b.z); }

// ---------- canvas panel (same class as Cold Start VR) ----------
function Panel(wM, hM, cw, ch) {
  this.cw = cw; this.ch = ch; this.wM = wM; this.hM = hM;
  this.canvas = document.createElement("canvas"); this.canvas.width = cw; this.canvas.height = ch;
  this.ctx = this.canvas.getContext("2d");
  this.tex = new THREE.CanvasTexture(this.canvas); this.tex.minFilter = THREE.LinearFilter; this.tex.anisotropy = 8; this.tex.encoding = THREE.sRGBEncoding;
  this.mesh = new THREE.Mesh(new THREE.PlaneGeometry(wM, hM), new THREE.MeshBasicMaterial({ map: this.tex, transparent: false }));
  this.mesh.userData.panel = this; this.hits = []; this.hover = -1;
}
Panel.prototype.begin = function () { var x = this.ctx; this.hits = []; x.setTransform(1, 0, 0, 1, 0, 0); x.fillStyle = C.paper; x.fillRect(0, 0, this.cw, this.ch); x.lineWidth = 10; x.strokeStyle = C.ink; x.strokeRect(5, 5, this.cw - 10, this.ch - 10); };
Panel.prototype.end = function () { this.tex.needsUpdate = true; };
Panel.prototype.font = function (px, style) { this.ctx.font = (style || "") + " " + px + "px " + FONT; };
Panel.prototype.text = function (s, x, y, color, px, style, align) { this.font(px, style); this.ctx.fillStyle = color || C.ink; this.ctx.textAlign = align || "left"; this.ctx.fillText(s, x, y); this.ctx.textAlign = "left"; };
Panel.prototype.para = function (s, x, y, maxW, color, px, style, lh) {
  var ctx = this.ctx; this.font(px, style); ctx.fillStyle = color || C.ink; ctx.textAlign = "left"; lh = lh || Math.round(px * 1.42);
  String(s).split("\n").forEach(function (p) {
    if (p === "") { y += lh * 0.5; return; }
    var words = p.split(" "), line = "";
    for (var i = 0; i < words.length; i++) { var t = line ? line + " " + words[i] : words[i]; if (ctx.measureText(t).width > maxW && line) { ctx.fillText(line, x, y); y += lh; line = words[i]; } else line = t; }
    if (line) { ctx.fillText(line, x, y); y += lh; }
  });
  return y;
};
Panel.prototype.rule = function (y, x1, x2) { var c = this.ctx; c.strokeStyle = C.rule; c.lineWidth = 3; c.beginPath(); c.moveTo(x1, y); c.lineTo(x2, y); c.stroke(); };
Panel.prototype.button = function (x, y, w, h, label, kind, action, px) {
  var c = this.ctx, idx = this.hits.length, hov = this.hover === idx;
  this.hits.push({ x: x, y: y, w: w, h: h, action: action });
  var fill = C.paper, stroke = C.ink, color = C.ink, alpha = 1;
  if (kind === "on" || kind === "primary") { fill = C.ink; color = C.paper; }
  if (kind === "track-on") { fill = C.orange; stroke = C.orange; color = C.white; }
  if (kind === "good") { fill = C.green; stroke = C.green; color = C.white; }
  if (kind === "bad") { fill = C.red; stroke = C.red; color = C.white; }
  if (kind === "dim") alpha = 0.4;
  if (hov && action && kind === "") fill = C.white;
  c.globalAlpha = alpha; c.fillStyle = fill; c.fillRect(x, y, w, h); c.lineWidth = 4; c.strokeStyle = stroke; c.strokeRect(x, y, w, h);
  if (hov && action) { c.lineWidth = 6; c.strokeStyle = C.orange; c.strokeRect(x - 6, y - 6, w + 12, h + 12); }
  if (label) { this.font(px || 28); c.fillStyle = color; c.textAlign = "center"; c.fillText(label, x + w / 2, y + h / 2 + (px || 28) * 0.36); c.textAlign = "left"; }
  c.globalAlpha = 1; return idx;
};
Panel.prototype.hitAt = function (u, v) { var px = u * this.cw, py = (1 - v) * this.ch; for (var i = 0; i < this.hits.length; i++) { var r = this.hits[i]; if (px >= r.x && px <= r.x + r.w && py >= r.y && py <= r.y + r.h) return i; } return -1; };

// ---------- the clipboard ----------
var board = new Panel(0.62, 0.80, 930, 1200);

function renderBoard() {
  if (feedback && feedback !== lastSpoken) { lastSpoken = feedback; speak(feedback); }
  var P = board, L = 40, W = P.cw - 80, y = 0;
  P.begin();
  // tabs
  var tabs = [["setout", "Set-out"], ["level", "Levelling"], ["grid", "Grid"], ["volumes", "Volumes"], ["cutfill", "Cut & fill"]];
  var bx = L;
  tabs.forEach(function (t) { P.button(bx, 28, 164, 58, t[1], t[0] === tab ? "track-on" : "", { tab: t[0] }, 22); bx += 171; });
  y = 130;
  if (tab !== "setout" && !tours[tab]) { renderComing(P, L, y, W); P.end(); return; }
  if (showPlan) { renderPlan(P, L, y, W); P.end(); return; }
  if (showSteps) { renderSteps(P, L, y, W); P.end(); return; }
  if (showSheet && tourSheets[tab]) { tourSheets[tab](P, L, y, W); P.end(); return; }
  if (showExplain) { renderExplain(P, L, y, W); P.end(); return; }

  var s = step();
  P.text(s.n === 0 ? "Before you start" : "Step " + s.n + " of " + (STEPS.length - 2), L + 170, y, C.mute, 26);
  P.button(P.cw - L - 150, y - 36, 150, 52, "Site plan", "", { act: "plan" }, 24);
  P.button(P.cw - L - 310, y - 36, 150, 52, "All steps", "", { act: "steps" }, 24);
  if (tourSheets[tab]) P.button(P.cw - L - 470, y - 36, 150, 52, "Sheet", "", { act: "sheet" }, 24);
  if (typeof EXPLAIN === "object" && explainFor(s)) P.button(L, y - 36, 150, 52, "Explain", "track-on", { act: "explain" }, 24);
  y += 64;
  y = P.para(s.title, L, y, W, C.ink, 40, "", 50); y += 6;
  P.rule(y, L, L + W); y += 44;
  if (s.mode === "done") y = renderDone(P, L, y, W);
  else if (s.mode === "end") { y = P.para(s.task, L, y, W, C.ink, 30); }
  else {
    y = P.para(s.task, L, y, W, C.ink, 30); y += 12;
    if (s.how && guided) s = Object.assign({}, s, { how: s.watch || "Press Do this step and watch." });
    if (s.how) { var y0 = y; y = P.para(s.how, L + 24, y, W - 24, C.blue, 29); P.ctx.fillStyle = C.blue; P.ctx.fillRect(L, y0 - 26, 6, y - y0 - 6); y += 16; }
    if (s.mode === "quiz") {
      s.options.forEach(function (o, i) {
        var kind = ""; if (quizPicked >= 0) kind = i === s.answer ? "good" : (i === quizPicked ? "bad" : "dim");
        P.button(L, y, W, 62, o, kind, quizPicked < 0 ? { quiz: i } : null, 28); y += 74;
      });
      y += 40;
    }
    if (s.mode === "keypad") {
      P.text("Diagonal", L, y + 42, C.mute, 30, "italic");
      var ex = L + 150; P.ctx.strokeStyle = C.ink; P.ctx.lineWidth = 4; P.ctx.beginPath(); P.ctx.moveTo(ex, y + 54); P.ctx.lineTo(ex + 300, y + 54); P.ctx.stroke();
      P.text((estimate || "") + (estimate ? " m" : ""), ex + 10, y + 42, C.ink, 36);
      var keys = ["7", "8", "9", "4", "5", "6", "1", "2", "3", "0", ".", "<"], k = 0, kx0 = L + 500;
      for (var r = 0; r < 4; r++) for (var cc = 0; cc < 3; cc++) { var key = keys[k++]; P.button(kx0 + cc * 90, y - 10 + r * 66, 80, 58, key === "<" ? "\u232B" : key, "", { key: key }, 30); }
      P.button(ex, y + 80, 200, 58, "Check", "primary", checked.calc ? null : { act: "calc" }, 28);
      y += 290;
    }
    if (s.mode === "measure") {
      P.button(L, y, 260, 62, "Measure", "primary", checked.measured ? null : { act: "measure" }, 28); y += 90;
      if (checked.measured) {
        var d = diagonals();
        P.text("A to G   " + fmt(d.ag), L, y, C.ink, 34); y += 44;
        P.text("F to D   " + fmt(d.fd), L, y, C.ink, 34); y += 44;
        P.text("Difference   " + mm(Math.abs(d.ag - d.fd)), L, y, Math.abs(d.ag - d.fd) <= TOL_DIAG ? C.green : C.red, 34); y += 54;

    }
