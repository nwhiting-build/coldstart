var STOREY_EXPLAIN = {
  t_intro: { terms: [["Rise in storeys", "Schedule 1: the greatest number of storeys calculated in accordance with C2D3 of Volume One."], ["Type of construction", "Type A, B or C. A is the most fire-resisting. Table C2D2 fixes it from the rise in storeys and the class; Specification 5 then gives the FRL of each element for that Type."]], working: ["Table C2D2. Class 2, 3, 9: rise 1 Type C, rise 2 Type B, rise 3 Type A, 4 or more Type A.", "Class 5, 6, 7, 8: rise 1 Type C, rise 2 Type C, rise 3 Type B, 4 or more Type A.", "C2D4: in a building of multiple classifications, apply the class of the top storey to all storeys and take the most fire-resisting result.", "Volume Two uses the same definition of storey; a two-storey Class 1a is a two-storey Class 1a by this test."] },
  t_a: { terms: [["Storey", "A space within a building situated between one floor level and the floor level next above, or if there is no floor above, the ceiling or roof above."], ["Floor level", "The top of the floor. Floor-to-floor is what is measured, not floor-to-ceiling."]], working: ["Ground floor level to first floor level: one storey.", "First floor level to the ceiling: one storey.", "Two."] },
  t_b: { terms: [["Sanitary compartment", "A room or space containing a closet pan or urinal."], ["Meter room", "A room containing only meters and the like."], ["Not more than 3 vehicles", "A garage for up to three cars is not a storey. A fourth car makes it one."]], working: ["Basement: bathroom only. Excluded by (a)(ii).", "Ground and first: storeys.", "Stair head at the top: stairway only. Excluded by (a)(i).", "Four floor levels, two storeys."] },
  t_c1: { terms: [["Mezzanine", "Schedule 1: an intermediate floor within a room, that is not separated from that room by walls."], ["Handrail, not wall", "A balustrade or handrail at the mezzanine edge does not separate it from the room. A wall does."]], working: ["Definition of storey, (b): not a mezzanine.", "One storey, floor to ceiling, with a mezzanine inside it.", "Until C2D3(4) is applied, which is a later model."] },
  t_c2: { terms: [["Enclosed", "Separated from the room by walls. It is then a room of its own, and the space from its floor to the ceiling above is a storey."]], working: ["The floor did not change. The wall did.", "Two storeys."] },
  t_d: { terms: [["Greatest number at any part", "Walk around the outside. Wherever the wall shows the most storeys above the finished ground next to it, that is the rise."], ["Finished ground", "The ground as it is after the site works. On a boundary wall, C2D3(1)(b) uses natural ground level at the boundary instead."]], working: ["Left wall: two storeys above the ground next to it.", "Right wall: three.", "Rise in storeys: three. The whole building is treated as three."] },
  t_e1: { terms: [["Average finished level of the ground", "The ground level along the external wall, averaged."], ["Underside of the ceiling", "The measurement point for the 1 m test. Not the floor, not the top of the wall."]], working: ["Floor level 0. Ceiling underside 3.0. Ground 1.8.", "3.0 minus 1.8 equals 1.2. More than 1 m.", "Counted. Rise three."] },
  t_e2: { terms: [["Not more than 1 m", "Exactly 1 m is out. 1.01 m is in."]], working: ["Ceiling underside 3.0. Ground 2.4.", "3.0 minus 2.4 equals 0.6. Not more than 1 m.", "Not counted. Rise two.", "A fully buried basement: ceiling below ground, so the number is negative. Not counted."] },
  t_f: { terms: [["The 12 m part where the ground is lowest", "Slide a 12 m window along the wall to where the ground is lowest, and average the ground level inside that window only."]], working: ["Wall 12 m long here, so the whole wall is the window in this model; on a 30 m wall you would take the lowest 12 m of it.", "Ground falls from 2.8 to 1.0 across the wall. On the low side the ceiling clears the ground by 2.0 m; on the high side by 0.2 m.", "Average over the lowest 12 m is well over 1 m. Counted. Rise three.", "Averaging a 40 m wall that mostly sits high would have hidden that."] },
  t_g: { terms: [["Service units or equipment", "Heating, ventilating or lift equipment, water tanks, or similar. Add an office up there and the storey counts."]], working: ["C2D3(2)(a). At the top, and containing only plant.", "Two storeys plus a plant level: rise two."] },
  t_h1: { terms: [["Average internal height", "Floor to underside of the roof or ceiling, averaged across the storey."], ["Only storey above the ground", "Nothing above it that counts as a storey."]], working: ["C2D3(3)(a): 7 m, but the only storey. Counted as one.", "Rise one. Type C for a Class 7 or 8."] },

window.addEventListener("keydown", function (e) { keys[e.key.toLowerCase()] = true; if (e.key === "Enter" && stepDone) act({ act: "next" }); if (e.key === " " && guided && !stepDone) { e.preventDefault(); runDemo(); } });
window.addEventListener("keyup", function (e) { keys[e.key.toLowerCase()] = false; });
function updateMouse(e) { mouse.x = (e.clientX / window.innerWidth) * 2 - 1; mouse.y = -(e.clientY / window.innerHeight) * 2 + 1; }
window.addEventListener("resize", function () { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });

// enter VR
var btn = document.getElementById("enter"), note = document.getElementById("note");
if (navigator.xr && navigator.xr.isSessionSupported) {
  navigator.xr.isSessionSupported("immersive-vr").then(function (ok) {
    if (ok) { btn.style.display = "inline-block"; note.textContent = "Stand still: each step brings the spot to you. Trigger: press a button or point at a building. Grip: bring the spot back in front of you."; }
    else note.textContent = "No headset in this browser. Drag to look around, click to act. Enter for Next, space for Do this step. Each step brings the spot to you.";
  });
} else note.textContent = "No WebXR here. Drag to look around, click to act. Enter for Next, space for Do this step. Each step brings the spot to you.";
btn.addEventListener("click", function () { ac(); primeSpeech(); speakStep(); navigator.xr.requestSession("immersive-vr", { optionalFeatures: ["local-floor", "bounded-floor"] }).then(function (session) { session.addEventListener("end", function () { document.getElementById("ui").style.display = "block"; }); renderer.xr.setSession(session); document.getElementById("ui").style.display = "none"; setTimeout(function () { walkTo(); }, 1500); setTimeout(function () { walkTo(); }, 4000); }); });

// ---------- loop ----------
var boardInit = false, boardFollow = true, boardTarget = new THREE.Vector3(), pageTarget = new THREE.Vector3(), camPos = new THREE.Vector3(), camDir = new THREE.Vector3(), lastT = performance.now();
scene.add(board.mesh); scene.add(page.mesh); page.mesh.visible = false;
renderer.setAnimationLoop(function () {
  var now = performance.now(), dt = Math.min(0.1, (now - lastT) / 1000); lastT = now;
  if (renderer.xr.isPresenting) {
    pollSticks(dt);
    var xrCam = renderer.xr.getCamera(camera); xrCam.getWorldPosition(camPos); xrCam.getWorldDirection(camDir);
    controllers.forEach(function (c) { if (c.visible) { var h = castFromController(c); updatePointer(h); c.userData.line.scale.z = h ? Math.min(h.dist, 80) : 5; } });
  } else {
    camera.rotation.set(pitch, yaw, 0, "YXZ");
    camera.getWorldPosition(camPos); camera.getWorldDirection(camDir);
    raycaster.setFromCamera(mouse, camera); updatePointer(castFrom(raycaster.ray.origin, raycaster.ray.direction));
  }
  camDir.y = 0; if (camDir.lengthSq() < 0.001) camDir.set(0, 0, -1); camDir.normalize();
  var vr = renderer.xr.isPresenting, rightV = new THREE.Vector3(-camDir.z, 0, camDir.x);
  boardTarget.copy(camPos).addScaledVector(camDir, vr ? 0.85 : 1.3).addScaledVector(rightV, vr ? 0 : 0.55); boardTarget.y = camPos.y - (vr ? 0.95 : 0.3);
  pageTarget.copy(camPos).addScaledVector(camDir, 1.2).addScaledVector(rightV, vr ? 0.25 : -0.55); pageTarget.y = camPos.y - 0.15;
  var toBoard = new THREE.Vector3().subVectors(board.mesh.position, camPos); toBoard.y = 0; var dBoard = toBoard.length(); toBoard.normalize();
  var ang = Math.acos(Math.max(-1, Math.min(1, toBoard.dot(camDir))));
  if (!boardInit || ang > 0.6 || dBoard > 1.6 || dBoard < 0.5) boardFollow = true;
  if (boardFollow) { board.mesh.position.lerp(boardTarget, boardInit ? 0.08 : 1); page.mesh.position.lerp(pageTarget, boardInit ? 0.08 : 1); if (board.mesh.position.distanceTo(boardTarget) < 0.03) boardFollow = false; boardInit = true; }
  board.mesh.lookAt(camPos.x, camPos.y, camPos.z);
  page.mesh.lookAt(camPos.x, page.mesh.position.y + 0.05, camPos.z);
  focusRing.scale.setScalar((focusTarget && focusTarget.w ? Math.max(1, focusTarget.w / 8) : 1) * (1 + 0.1 * Math.sin(now / 250)));
  // labels face you
  LOTITEMS.forEach(function (b) { if (b.roof === "none") { var sp = new THREE.Vector3(); b.signPanel.mesh.getWorldPosition(sp); b.signPanel.mesh.lookAt(camPos.x, sp.y, camPos.z); } });
  STREET.concat(LOTITEMS).concat([bh]).concat(MODELS).forEach(function (b) { if (b.label.mesh.visible) b.label.mesh.lookAt(camPos.x, b.label.mesh.position.y + b.group.position.y, camPos.z); });
  [stairLabel].forEach(function (l) { if (l.mesh.visible) { var wp = new THREE.Vector3(); l.mesh.getWorldPosition(wp); l.mesh.lookAt(camPos.x, wp.y, camPos.z); } });
  if (hoverLabel.mesh.visible) hoverLabel.mesh.lookAt(camPos.x, hoverLabel.mesh.position.y, camPos.z);
  renderer.render(scene, camera);
});

switchTab("street");
</script>
